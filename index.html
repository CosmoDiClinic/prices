<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmo Di Aesthetic Clinic — Price List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --burgundy:#430E14;
  --burgundy-deep:#3A0D18;
  --subhead:#5C1F2E;
  --ink:#2B251C;
  --cream:#FAF8F7;
  --beige:#DCD2CC;
  --gold:#C9A36A;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Jost',sans-serif;background:var(--burgundy-deep);color:var(--ink);font-weight:300;line-height:1.5;-webkit-font-smoothing:antialiased;}

.hero{background:var(--burgundy-deep);color:var(--cream);text-align:center;padding:64px 24px 52px;border-bottom:1px solid rgba(201,163,106,.25);}
.logo-slot{margin-bottom:22px;display:flex;justify-content:center;align-items:center;}
.logo-slot img{height:104px;width:auto;display:block}
.clinic-name{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(2.7rem,7vw,4.6rem);line-height:1;letter-spacing:.02em;color:var(--cream);text-transform:uppercase;}
.clinic-name .clinic-sub{display:block;font-family:'Jost',sans-serif;font-style:normal;font-weight:300;font-size:.2em;letter-spacing:.42em;color:var(--beige);margin-top:16px;text-transform:uppercase;}
.price-label{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.6rem,4.5vw,2.4rem);color:var(--gold);font-weight:500;margin-top:24px;letter-spacing:.03em;}
.gold-rule{width:56px;height:1px;background:var(--gold);margin:26px auto 0;}
.hero .lic{margin-top:22px;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(250,248,247,.5);font-weight:400;}

.controls{position:sticky;top:0;z-index:20;background:rgba(58,13,24,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(201,163,106,.22);padding:14px 24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.search{position:relative;width:min(420px,100%);}
.search input{width:100%;background:rgba(250,248,247,.06);border:1px solid rgba(201,163,106,.35);border-radius:2px;color:var(--cream);font-family:'Jost',sans-serif;font-weight:300;font-size:.95rem;letter-spacing:.02em;padding:11px 16px 11px 40px;outline:none;transition:border-color .2s;}
.search input::placeholder{color:rgba(250,248,247,.45)}
.search input:focus{border-color:var(--gold)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:rgba(201,163,106,.7);fill:none;}
.btn-toggle{background:transparent;border:1px solid rgba(201,163,106,.35);color:var(--gold);font-family:'Jost',sans-serif;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:400;padding:0 18px;border-radius:2px;cursor:pointer;transition:background .2s,color .2s;}
.btn-toggle:hover{background:var(--gold);color:var(--burgundy-deep)}

.menu{background:var(--cream);max-width:820px;margin:0 auto;padding:56px 20px 40px;}
.cat{border-bottom:1px solid var(--beige);}
.cat:first-child{border-top:1px solid var(--beige)}
.cat-head{width:100%;background:none;border:none;cursor:pointer;display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:26px 6px;text-align:left;font-family:inherit;}
.cat-head:hover .cat-title{color:var(--burgundy)}
.cat-title{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(1.55rem,4vw,2.05rem);color:var(--subhead);letter-spacing:.01em;transition:color .2s;line-height:1.1;}
.cat-meta{display:flex;align-items:center;gap:16px;flex-shrink:0}
.cat-count{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:400;}
.chev{width:11px;height:11px;border-right:1.5px solid var(--subhead);border-bottom:1.5px solid var(--subhead);transform:rotate(45deg);transition:transform .3s;margin-bottom:3px;}
.cat.open .chev{transform:rotate(-135deg);margin-bottom:-3px}
.cat-body{display:none;padding:0 6px 12px;}
.cat.open .cat-body{display:block}
.item{display:flex;align-items:baseline;gap:14px;padding:13px 0;border-top:1px solid rgba(220,210,204,.55);}
.item:first-child{border-top:none}
.item-name{font-size:.98rem;font-weight:300;color:var(--ink);letter-spacing:.01em;flex:1;}
.dots{flex:1;border-bottom:1px dotted var(--beige);transform:translateY(-4px);min-width:18px;}
.item-price{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.12rem;color:var(--burgundy);white-space:nowrap;letter-spacing:.01em;}
.item-price .cur{font-family:'Jost',sans-serif;font-weight:400;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-left:5px;vertical-align:middle;}
.cat.lab .cat-body{max-height:520px;overflow-y:auto}
.cat.lab .cat-body::-webkit-scrollbar{width:5px}
.cat.lab .cat-body::-webkit-scrollbar-thumb{background:var(--beige);border-radius:3px}
.no-results{text-align:center;padding:60px 20px;color:var(--subhead);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.4rem;display:none;}

.foot{background:var(--burgundy-deep);color:var(--cream);text-align:center;padding:44px 24px 52px;}
.foot .vat{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:400;margin-bottom:20px;}
.foot .note{font-size:.86rem;color:rgba(250,248,247,.6);font-weight:300;max-width:440px;margin:0 auto;line-height:1.7;}
.foot .name{font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--cream);margin-top:30px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;}
.foot .lic{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(250,248,247,.45);margin-top:8px;}

@media(max-width:560px){.hero{padding:48px 20px 40px}.logo-slot img{height:84px}.menu{padding:40px 16px 30px}.cat-head{padding:22px 4px}.controls{padding:12px 16px}}
</style>
</head>

const menu=document.getElementById('menu');
const noResults=document.getElementById('noResults');
document.getElementById('vatNote').textContent=DATA.vat_note;
function priceHTML(p){return `${p}<span class="cur">${DATA.currency}</span>`;}
DATA.categories.forEach((cat)=>{
  const sec=document.createElement('section');
  sec.className='cat'+(cat.lab?' lab':'');
  const head=document.createElement('button');
  head.className='cat-head';
  head.innerHTML=`<span class="cat-title">${cat.category}</span><span class="cat-meta"><span class="cat-count">${cat.count} ${cat.count===1?'treatment':'treatments'}</span><span class="chev"></span></span>`;
  head.addEventListener('click',()=>sec.classList.toggle('open'));
  const body=document.createElement('div');
  body.className='cat-body';
  cat.items.forEach(it=>{
    const row=document.createElement('div');
    row.className='item';
    row.dataset.name=it.name.toLowerCase();
    row.innerHTML=`<span class="item-name">${it.name}</span><span class="dots"></span><span class="item-price">${priceHTML(it.price)}</span>`;
    body.appendChild(row);
  });
  sec.appendChild(head);sec.appendChild(body);menu.appendChild(sec);
});
const q=document.getElementById('q');
const toggleBtn=document.getElementById('toggleAll');
let expanded=false;
q.addEventListener('input',()=>{
  const term=q.value.trim().toLowerCase();
  let anyVisible=false;
  document.querySelectorAll('.cat').forEach(sec=>{
    const rows=sec.querySelectorAll('.item');let match=0;
    rows.forEach(r=>{const hit=!term||r.dataset.name.includes(term);r.style.display=hit?'':'none';if(hit)match++;});
    if(term){sec.style.display=match?'':'none';sec.classList.toggle('open',match>0);if(match)anyVisible=true;}
    else{sec.style.display='';}
  });
  if(term){noResults.style.display=anyVisible?'none':'block';}
  else{noResults.style.display='none';document.querySelectorAll('.cat').forEach(s=>s.classList.remove('open'));toggleBtn.textContent='Expand all';expanded=false;}
});
toggleBtn.addEventListener('click',()=>{
  expanded=!expanded;
  document.querySelectorAll('.cat').forEach(s=>{if(s.style.display!=='none')s.classList.toggle('open',expanded);});
  toggleBtn.textContent=expanded?'Collapse all':'Expand all';
});
</script>
